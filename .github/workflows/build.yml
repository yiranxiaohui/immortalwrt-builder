name: Build ImmortalWrt x86_64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - 'scripts/**'
      - 'files/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: openwrt-25.12
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup
          sudo docker image prune -a -f
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev python3-pyelftools rsync swig unzip \
            zlib1g-dev file wget libelf-dev ecj fastjar java-wrappers \
            qemu-utils genisoimage zstd

      - name: Clone ImmortalWrt source
        run: git clone --depth 1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: DIY part 1 (third-party packages)
        run: |
          chmod +x scripts/diy-part1.sh
          cd openwrt && $GITHUB_WORKSPACE/scripts/diy-part1.sh

      - name: Update and install feeds
        run: cd openwrt && ./scripts/feeds update -a && ./scripts/feeds install -a

      - name: Load config and DIY part 2 (files overlay)
        run: |
          cp config/x86_64.config openwrt/.config
          chmod +x scripts/diy-part2.sh
          cd openwrt
          $GITHUB_WORKSPACE/scripts/diy-part2.sh
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j8
          find dl -size -1024c -exec rm -f {} \;
          make download -j1

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Collect firmware
        id: firmware
        run: |
          echo "tag=$(date +%Y.%m.%d-%H%M)" >> "$GITHUB_OUTPUT"
          cd openwrt/bin/targets/x86/64
          ls -lh
          echo "version=$(grep -oP "DISTRIB_RELEASE='\K[^']+" ../../../../package/base-files/files/etc/openwrt_release || true)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.firmware.outputs.tag }}
          name: ImmortalWrt x86_64 ${{ steps.firmware.outputs.tag }}
          body: |
            ImmortalWrt ${{ env.REPO_BRANCH }} x86/64 自动编译
            - ext4 + EFI/BIOS combined 镜像，kernel 32M + rootfs 1024M
            - 首次开机自动扩容 rootfs 至整盘（扩容过程会自动重启两次）
            - 预装 OpenClash（内置 mihomo 内核与 GeoIP/GeoSite 数据）、qemu-ga
            - 默认 LAN IP 192.168.1.1
          files: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/*.buildinfo
            openwrt/bin/targets/x86/64/sha256sums
